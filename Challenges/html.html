<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1">
    <title>First Challenge</title>
    <link href="css/css.css" rel="stylesheet">
</head>

<body>
    <div class="navbar">
        <a href="#Home">Home</a>
        <a href="#About">About</a>
        <a href="#Contact">Contact</a>
    </div>
    <div>
        <table>
            <tr>
                <th>Cat Tower</th>
                <th>Cat Name</th>
                <th>Cat Village</th>
            </tr>
            <tr>
                <td>Kneel Before Me</td>
                <td>Pomi</td>
                <td>Bed</td>
            </tr>
            <tr>
                <td>All Rise</td>
                <td>Goldie</td>
                <td>Tree House</td>
            </tr>
        </table>
    </div>
    <div class="container">
        <img src="images/cat_1.jpg" alt="Funny Cat" class="center round">
        <div class="centered">Give me Food</div>
    </div>
    <p class="hover-text center-text">Meow Meow Meow... Meow Meow</p>
    <div class="row">
        <div class="column" style="background-color: gray;">
            <h2>Cat Column 1</h2>
            <p class="highlight">Meow</p>
        </div>
        <div class="column" style="background-color: lightgray;">
            <h2>Cat Column 2</h2>
            <p class="highlight">Meow</p>
        </div>
    </div>
    <div class="container2">
        <img src="images/cat_2.jpg" class="image" alt="thumbs up cat">
        <div class="overlay">
            <div class="image-text">Meow</div>
        </div>
    </div>

    <div class="video-container">
        <video autoplay muted loop>
            <source src="video/cat_video.mp4" type="video/mp4">
        </video>
        <div class="video-text">
            Give me Water
        </div>
    </div>
    <!--FOOTER-->
    <section>
        <div class="footcenter">
            <p class="thicker">&copy; Cat Picture</p>
        </div>
    </section>
</body>

</html>
