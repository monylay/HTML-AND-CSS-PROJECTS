<!doctype html>
<html>

<head>
    <title>All About Cats</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="CSS/one_page_website.css">
    <script src="JS/one_page_website.js" defer></script>
</head>

<body>
    <!--NAVBAR-->
    <nav>
        <ul>
            <li><a href="one_page_website.html">HOME</a></li>
            <li><a href="contact_1.html">CONTACT</a></li>
        </ul>
    </nav>
    <!--HEADER-->
    <header>
        <div>
            <h1>Welcome to the Cat Page!</h1>
        </div>
    </header>
    <!--CAT IMAGES-->
    <section>
        <div>
            <h2>Choose a Cat!</h2>
            <div>
                <div class="row">
                    <div class="column">
                        <img src="cat_images/cat_1.png" style="width:50%" onclick="openModal();currentSlide(1)"
                            class="hover-shadow cursor">
                    </div>
                    <div class="column">
                        <img src="cat_images/cat_2.jpg" style="width:50%" onclick="openModal();currentSlide(2)"
                            class="hover-shadow cursor">
                    </div>
                    <div class="column">
                        <img src="cat_images/cat_3.jpg" style="width:50%" onclick="openModal();currentSlide(3)"
                            class="hover-shadow cursor">
                    </div>
                    <div class="column">
                        <img src="cat_images/cat_4.png" style="width:50%" onclick="openModal();currentSlide(4)"
                            class="hover-shadow cursor">
                    </div>
                </div>
                <div id="myModal" class="modal">
  <span class="close cursor" onclick="closeModal()">&times;</span>
  <div class="modal-content">

    <div class="mySlides">
      <div class="numbertext">1 / 4</div>
      <img src="cat_images/cat_1.png" style="width:100%">
    </div>

    <div class="mySlides">
      <div class="numbertext">2 / 4</div>
      <img src="cat_images/cat_2.jpg" style="width:100%">
    </div>

    <div class="mySlides">
      <div class="numbertext">3 / 4</div>
      <img src="cat_images/cat_3.jpg" style="width:100%">
    </div>
    
    <div class="mySlides">
      <div class="numbertext">4 / 4</div>
      <img src="cat_images/cat_4.png" style="width:100%">
    </div>
    
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>

    <div class="caption-container">
      <p id="caption"></p>
    </div>

     <div class="column">
      <img class="demo cursor" src="cat_images/cat_1.png" style="width:25%" onclick="currentSlide(1)" alt="smile cat">
    </div>
    <div class="column">
      <img class="demo cursor" src="cat_images/cat_2.jpg" style="width:25%" onclick="currentSlide(2)" alt="cough cat">
    </div>
    <div class="column">
      <img class="demo cursor" src="cat_images/cat_3.jpg" style="width:25%" onclick="currentSlide(3)" alt="shocked cat">
    </div>
    <div class="column">
      <img class="demo cursor" src="cat_images/cat_4.png" style="width:25%" onclick="currentSlide(4)" alt="cry cat">
    </div>
  </div>
</div>
    </section>
    <!--CAT VIDEO-->
    <section>
        <div id="video">
            <h3>Videos</h3>
            <iframe width="1280" height="720"
                src="https://www.youtube.com/embed/OqH9RoUNG24?si=T0cclQvCLX7uDzBt"></iframe>
        </div>
    </section>
    <!--FOOTER-->
    <footer>
        <table>
            <tr>
                <td>
                    <p>The Cat Page! &copy;</p>
                </td>
                <td>
                    <p>123 Cat St</p>
                    <p>Catland, CAT 77777</p>
                </td>
                <td>
                    <p>123-456-7777</p>
                </td>
            </tr>
        </table>
    </footer>
</body>

</html>
